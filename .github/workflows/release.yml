name: Release
# Se ejecuta al crear una etiqueta: git tag v0.1.0 && git push origin v0.1.0
on:
  push: { tags: ['v*'] }
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04   # glibc antigua = compatible con más distribuciones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # rpm (rpmbuild) y libarchive-tools (bsdtar) los necesita electron-builder para .rpm y .pacman
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools fakeroot
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist
      - name: Checksums
        working-directory: release
        run: sha256sum dictaflow-linux-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/dictaflow-linux-amd64.deb
            release/dictaflow-linux-x86_64.rpm
            release/dictaflow-linux-x86_64.pacman
            release/dictaflow-linux-x86_64.AppImage
            release/dictaflow-linux-x64.tar.gz
            release/SHA256SUMS.txt
