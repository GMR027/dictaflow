name: Site image
# Construye la web y publica una imagen de contenedor en GHCR para desplegarla en el clúster.
on:
  push:
    branches: [main]
    paths: ['site/**', 'deploy/Dockerfile', 'package.json', '.github/workflows/site-image.yml']
  # Las releases creadas con GITHUB_TOKEN no disparan otros flujos; por eso se encadena con workflow_run.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Descargar SHA256SUMS de la última release (si existe)
        run: |
          curl -fsSL -o SHA256SUMS.txt "https://github.com/${{ github.repository }}/releases/latest/download/SHA256SUMS.txt" || : > SHA256SUMS.txt   # sin release todavía: web sin hashes
      # Misma etiqueta que calcula deploy.sh (git rev-parse --short HEAD = 7 caracteres)
      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/gmr027/dictaflow-site:latest
            ghcr.io/gmr027/dictaflow-site:${{ steps.tag.outputs.short }}
