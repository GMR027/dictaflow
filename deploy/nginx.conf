server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location /img/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ =404; }

  # App de Android (android/publicar.sh). La app lee version.json desde Rust (sin CORS) y abre
  # /app/android/descargar en el navegador. Nada en caché: una versión nueva se ve al momento.
  # (add_header dentro de un location anula los del server: se repiten los necesarios.)
  location = /app/android/version.json {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location = /app/android/descargar {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Disposition 'attachment; filename="dictaflow-android.apk"' always;
    # mime.types de nginx no trae .apk: sin esto saldría como application/octet-stream.
    types { application/vnd.android.package-archive apk; }
    try_files /app/android/dictaflow-android.apk =404;
  }
  location = /app/android/dictaflow-android.apk { return 301 /app/android/descargar; }
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}
