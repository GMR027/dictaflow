server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location /img/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ =404; }
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}
