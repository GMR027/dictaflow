replicaCount: 2

# La página no va en ninguna imagen ni registro: deploy/deploy.sh la sube al clúster como
# ConfigMaps (ver templates/deployment.yaml) y pone aquí su hash y en cuántos trozos va.
web:
  image: nginxinc/nginx-unprivileged:1.27-alpine
  hash: ""
  parts: 0

service:
  port: 80

ingress:
  enabled: true
  className: nginx      # IngressClass de tu clúster (existen: nginx y public)
  host: dictaflow.iguzman.com.mx
  annotations: {}
  tls:
    enabled: true
    secretName: dictaflow-site-tls
    clusterIssuer: letsencrypt-prod   # ClusterIssuer de tu clúster; vacío = no se añade anotación

resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { cpu: 200m, memory: 64Mi }

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# App de Android (APK + version.json) en un volumen del clúster, fuera de la imagen de la web:
# el APK no se sube a ningún registro. Lo publica android/publicar.sh.
android:
  enabled: true
  image: nginxinc/nginx-unprivileged:1.27-alpine
  storage: 1Gi
  storageClass: ""        # vacío = la predeterminada del clúster
