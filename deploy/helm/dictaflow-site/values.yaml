replicaCount: 2

image:
  repository: ghcr.io/gmr027/dictaflow-site
  tag: latest            # el script de despliegue lo sustituye por una etiqueta única en cada release
  pullPolicy: IfNotPresent
imagePullSecrets: []     # p. ej. [{ name: ghcr-pull }] si la imagen es privada

service:
  port: 80

ingress:
  enabled: true
  className: nginx      # IngressClass de tu clúster (existen: nginx y public)
  host: dictaflow.iguzman.com.mx
  annotations: {}
  tls:
    enabled: true
    secretName: dictaflow-site-tls
    clusterIssuer: letsencrypt-prod   # ClusterIssuer de tu clúster; vacío = no se añade anotación

resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { cpu: 200m, memory: 64Mi }

podDisruptionBudget:
  enabled: true
  minAvailable: 1
