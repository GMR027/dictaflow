# Pruebas de las reglas puras de src/ sin compilar Tauri (no requiere WebKit ni el SDK de Android).
#   cargo test --manifest-path pruebas/Cargo.toml     (desde android/src-tauri)
[package]
name = "dictaflow-android-pruebas"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"

[workspace]
