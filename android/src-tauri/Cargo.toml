[package]
name = "dictaflow-android"
version = "0.1.0"
description = "DictaFlow para Android: dictado por voz con IA local"
authors = ["GMR027"]
license = "MIT"
edition = "2021"
publish = false

[lib]
# Tauri móvil compila la app como biblioteca que carga la actividad de Android.
name = "dictaflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# APK de pruebas (compilar.sh --depurar): misma firma que el de publicación, pero con el WebView
# inspeccionable desde la PC. No se publica.
depuracion = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Descarga de modelos (HTTPS con rustls, sin depender de OpenSSL del sistema) y su verificación.
ureq = "3"
sha2 = "0.10"
libc = "0.2"
# Whisper (whisper.cpp) dentro del proceso: transcripción sin conexión.
whisper-rs = "0.16"
# Redacción con IA (llama.cpp, modelos GGUF) dentro del proceso. Sin OpenMP (hilos propios de ggml)
# ni `common`; con la libc++ compartida del NDK, igual que whisper.cpp.
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["android-shared-stdcxx"] }
# Lectura en voz alta: voces Piper con sherpa-onnx (onnxruntime + espeak-ng). En Android usa sus
# librerías precompiladas (.so); entorno.sh indica dónde están (SHERPA_ONNX_LIB_DIR).
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
# Extrae los datos de pronunciación de espeak-ng que lleva la app (recursos/espeak-ng-data.tar).
tar = { version = "0.4", default-features = false }

# whisper.cpp y llama.cpp traen cada uno su ggml. Esta copia de whisper-rs-sys compila whisper.cpp
# con el ggml de llama.cpp, para que la app lleve una sola copia (ver vendor/whisper-rs-sys/build.rs).
[patch.crates-io]
whisper-rs-sys = { path = "../vendor/whisper-rs-sys" }

[profile.release]
# APK pequeño: optimiza tamaño, sin símbolos y con LTO. (La inferencia de Whisper y del LLM se
# compila en C/C++ con sus propias optimizaciones.)
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# whisper.cpp (C++) siempre optimizado, también en el APK de depuración: sin esto es decenas de
# veces más lento y no sirve para probar en el teléfono.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
