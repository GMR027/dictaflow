[package]
name = "dictaflow-android"
version = "0.1.0"
description = "DictaFlow para Android: dictado por voz con IA local"
authors = ["GMR027"]
license = "MIT"
edition = "2021"
publish = false

[lib]
# Tauri móvil compila la app como biblioteca que carga la actividad de Android.
name = "dictaflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Descarga de modelos (HTTPS con rustls, sin depender de OpenSSL del sistema) y su verificación.
ureq = "3"
sha2 = "0.10"
libc = "0.2"
# Whisper (whisper.cpp) dentro del proceso: transcripción sin conexión.
whisper-rs = "0.16"

[profile.release]
# APK pequeño: optimiza tamaño, sin símbolos y con LTO. (La inferencia de Whisper/LLM, que llega
# en fases posteriores, se compila en C/C++ con sus propias optimizaciones.)
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# whisper.cpp (C++) siempre optimizado, también en el APK de depuración: sin esto es decenas de
# veces más lento y no sirve para probar en el teléfono.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
